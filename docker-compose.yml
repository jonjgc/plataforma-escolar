version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: escolar_db
    environment:
      POSTGRES_DB: escolar_db
      POSTGRES_USER: escolar_user
      POSTGRES_PASSWORD: escolar_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: escolar_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=escolar_db
      - DB_USER=escolar_user
      - DB_PASSWORD=escolar_password

  frontend:
    build: ./frontend
    container_name: escolar_frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: